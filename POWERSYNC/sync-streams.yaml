# =====================================================================
# NACRÉA · Règles de synchronisation PowerSync (Sync Streams)
# À coller dans le tableau de bord PowerSync > Sync Streams, puis "Deploy".
#
# - Toute personne reçoit le catalogue, l'équipe et les clientes de son entreprise.
# - La patronne reçoit toutes ses boutiques (stock, ventes, abonnements).
# - Une employée ne reçoit que sa boutique.
# =====================================================================
config:
  edition: 3

streams:
  entreprise:
    auto_subscribe: true
    with:
      mes_comptes: SELECT account_id FROM members WHERE user_id = auth.user_id() AND active = true
    queries:
      - SELECT * FROM accounts WHERE id IN mes_comptes
      - SELECT * FROM members WHERE account_id IN mes_comptes
      - SELECT * FROM categories WHERE account_id IN mes_comptes
      - SELECT * FROM products WHERE account_id IN mes_comptes
      # Clientes et crédit : visibles dans toutes les boutiques de l'entreprise
      - SELECT * FROM customers WHERE account_id IN mes_comptes
      - SELECT * FROM customer_payments WHERE account_id IN mes_comptes
      - SELECT * FROM sales WHERE account_id IN mes_comptes AND customer_id IS NOT NULL
      - SELECT * FROM payments WHERE account_id IN mes_comptes AND method = 'credit'
      # Fournisseurs : communs à toutes les boutiques
      - SELECT * FROM suppliers WHERE account_id IN mes_comptes

  boutiques_patronne:
    auto_subscribe: true
    with:
      comptes_patronne: SELECT account_id FROM members WHERE user_id = auth.user_id() AND role = 'owner' AND active = true
    queries:
      - SELECT * FROM shops WHERE account_id IN comptes_patronne
      - SELECT * FROM subscriptions WHERE account_id IN comptes_patronne
      - SELECT * FROM stock_lots WHERE account_id IN comptes_patronne
      - SELECT * FROM sales WHERE account_id IN comptes_patronne
      - SELECT * FROM sale_items WHERE account_id IN comptes_patronne
      - SELECT * FROM payments WHERE account_id IN comptes_patronne
      - SELECT * FROM cash_sessions WHERE account_id IN comptes_patronne
      - SELECT * FROM cash_movements WHERE account_id IN comptes_patronne
      - SELECT * FROM expenses WHERE account_id IN comptes_patronne
      - SELECT * FROM stock_adjustments WHERE account_id IN comptes_patronne
      - SELECT * FROM inventories WHERE account_id IN comptes_patronne

  boutique_employee:
    auto_subscribe: true
    with:
      boutiques_employee: SELECT shop_id FROM members WHERE user_id = auth.user_id() AND role = 'employee' AND active = true
    queries:
      - SELECT * FROM shops WHERE id IN boutiques_employee
      # Statut d'abonnement : pour mettre la caisse en pause si la boutique n'est pas à jour
      - SELECT * FROM subscriptions WHERE shop_id IN boutiques_employee
      - SELECT * FROM stock_lots WHERE shop_id IN boutiques_employee
      - SELECT * FROM sales WHERE shop_id IN boutiques_employee
      - SELECT * FROM sale_items WHERE shop_id IN boutiques_employee
      - SELECT * FROM payments WHERE shop_id IN boutiques_employee
      - SELECT * FROM cash_sessions WHERE shop_id IN boutiques_employee
      - SELECT * FROM cash_movements WHERE shop_id IN boutiques_employee
      - SELECT * FROM expenses WHERE shop_id IN boutiques_employee
      - SELECT * FROM stock_adjustments WHERE shop_id IN boutiques_employee
      - SELECT * FROM inventories WHERE shop_id IN boutiques_employee
