# Fabrique l'application Android (APK) de Nacréa sur les serveurs de GitHub
# et la publie dans « Releases ». Lien de téléchargement toujours à jour :
# https://github.com/senyokossimawuli-cmyk/nacrea/releases/latest/download/nacrea.apk
name: Application Android

on:
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths: # seulement quand l'application change
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Signature définitive : utilisée seulement si les secrets existent.
      - name: Signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/nacrea.jks
          cat > android/key.properties <<PROPS
          storeFile=nacrea.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=nacrea
          PROPS

      - run: flutter pub get

      - name: Fabrication de l'APK
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Noms des fichiers
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk nacrea.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk nacrea-ancien-telephone.apk
          ls -lh *.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Nacréa Android · version ${{ github.run_number }}
          make_latest: true
          body: |
            Application Android de Nacréa.
            - nacrea.apk : pour la plupart des téléphones.
            - nacrea-ancien-telephone.apk : seulement si le premier ne s'installe pas.
          files: |
            nacrea.apk
            nacrea-ancien-telephone.apk
