# Vérifie le code (erreurs de compilation, avertissements) sans fabriquer d'APK.
# Lancée sur les branches « verif/... » avant de livrer une nouveauté.
name: Vérification du code

on:
  push:
    branches: ['verif/**']

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Paquets
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub.txt || {
            # Les erreurs deviennent des annotations lisibles sur GitHub
            grep -v '^\s*$' pub.txt | tail -25 | sed 's/^/::error::/'
            exit 1
          }
      - name: Analyse
        run: |
          dart analyze --format=machine > analyse.txt 2>&1 || true
          # Chaque problème devient une annotation lisible sur GitHub.
          awk -F'|' 'NF>=8 { sev=($1=="ERROR")?"error":"warning"; f=$4; sub(/^.*\/lib\//,"lib/",f); print "::" sev " file=" f ",line=" $5 "::" $8 }' analyse.txt
          if grep -q '^ERROR|' analyse.txt; then exit 1; fi
      - run: flutter test

  # Version web : fabrication + captures d'écran (iPhone et PC) déposées sur la branche « captures ».
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run powersync:setup_web
      - name: Moteur de base de données (mêmes versions que l'appli)
        run: dart compile js -O4 -o web/powersync_db.worker.js tool/powersync_db_worker.dart
      - name: Fabrication du site
        run: |
          set -o pipefail
          flutter build web --release --no-web-resources-cdn --base-href /nacrea/ 2>&1 | tee web.txt || {
            grep -iE 'error|erreur' web.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
          mkdir -p site/nacrea && cp -r build/web/* site/nacrea/
          flutter build web --release --no-web-resources-cdn --base-href /apercu/ --dart-define=APERCU=true 2>&1 | tee web2.txt || {
            grep -iE 'error|erreur' web2.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
          mkdir -p site/apercu && cp -r build/web/* site/apercu/
      - name: Captures
        run: |
          mkdir -p captures
          (cd site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium >/dev/null
          cat > capture.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(args=['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'])
                  iphone = dict(**p.devices['iPhone 13'])
                  pc = dict(viewport={'width': 1280, 'height': 900})
                  # Flutter fait défiler à l'intérieur de la page : une fenêtre haute montre tout l'accueil.
                  iphone_long = dict(iphone, viewport={'width': 390, 'height': 2700})
                  pc_long = dict(viewport={'width': 1280, 'height': 1500})
                  for nom, opts, url, sombre in [
                      ('connexion-iphone', iphone, '/nacrea/', False),
                      ('connexion-iphone-sombre', iphone, '/nacrea/', True),
                      ('accueil-iphone', iphone_long, '/apercu/', False),
                      ('accueil-iphone-sombre', iphone_long, '/apercu/?mode=sombre', True),
                      ('accueil-pc', pc_long, '/apercu/', False),
                      ('accueil-pc-sombre', pc_long, '/apercu/?mode=sombre', True),
                  ]:
                      ctx = await b.new_context(**opts, locale='fr-FR')
                      if sombre:
                          await ctx.add_init_script("localStorage.setItem('yds.mode-affichage', 'sombre')")
                      page = await ctx.new_page()
                      journal = []
                      page.on('console', lambda m: journal.append(f'{m.type}: {m.text}'))
                      page.on('pageerror', lambda e: journal.append(f'ERREUR: {e}'))
                      await page.goto('http://localhost:8080' + url)
                      await page.wait_for_timeout(20000)
                      await page.screenshot(path=f'captures/{nom}.png', full_page=True)
                      open(f'captures/{nom}.txt', 'w').write('\n'.join(journal))
                      await ctx.close()
                  await b.close()
          asyncio.run(main())
          PY
          python3 capture.py
          ls -l captures
      - name: Dépôt des captures
        run: |
          cd captures
          git init -q
          git config user.name "verification"
          git config user.email "verification@users.noreply.github.com"
          git checkout -q -b captures
          git add .
          git commit -qm "Captures ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" captures

  # Démarrage de l'APK sur un téléphone Android virtuel : capture d'écran + journal, sur la branche « captures-android ».
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Versions des paquets
        run: |
          mkdir -p captures
          cp pubspec.lock captures/pubspec.lock
      - name: Fabrication de l'APK (toutes architectures)
        run: flutter build apk --release
      - name: Accélération KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test sur téléphone virtuel
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.nacrea.nacrea -c android.intent.category.LAUNCHER 1
            sleep 40
            adb exec-out screencap -p > captures/android.png
            adb logcat -d > captures/logcat-complet.txt || true
            grep -iE "flutter|dart|exception|error|fatal|powersync|sqlite" captures/logcat-complet.txt | tail -300 > captures/logcat.txt || true
      - name: Dépôt des captures
        if: always()
        run: |
          cd captures
          git init -q
          git config user.name "verification"
          git config user.email "verification@users.noreply.github.com"
          git checkout -q -b captures-android
          git add .
          git commit -qm "Android ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" captures-android
