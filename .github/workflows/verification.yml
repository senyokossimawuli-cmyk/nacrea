# Vérifie le code (erreurs de compilation, avertissements) sans fabriquer d'APK.
# Lancée sur les branches « verif/... » avant de livrer une nouveauté.
name: Vérification du code

on:
  push:
    branches: ['verif/**']

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Paquets
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub.txt || {
            # Les erreurs deviennent des annotations lisibles sur GitHub
            grep -v '^\s*$' pub.txt | tail -25 | sed 's/^/::error::/'
            exit 1
          }
      - name: Analyse
        run: |
          dart analyze --format=machine > analyse.txt 2>&1 || true
          # Chaque problème devient une annotation lisible sur GitHub.
          awk -F'|' 'NF>=8 { sev=($1=="ERROR")?"error":"warning"; f=$4; sub(/^.*\/lib\//,"lib/",f); print "::" sev " file=" f ",line=" $5 "::" $8 }' analyse.txt
          if grep -q '^ERROR|' analyse.txt; then exit 1; fi
      - run: flutter test

  # Version web : fabrication + captures d'écran (iPhone et PC) déposées sur la branche « captures ».
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run powersync:setup_web
      - name: Fabrication du site
        run: |
          set -o pipefail
          flutter build web --release --no-web-resources-cdn --base-href /nacrea/ 2>&1 | tee web.txt || {
            grep -iE 'error|erreur' web.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: Captures
        run: |
          mkdir -p site/nacrea captures
          cp -r build/web/* site/nacrea/
          (cd site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium >/dev/null
          cat > capture.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(args=['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'])
                  for nom, opts in [
                      ('iphone', dict(**p.devices['iPhone 13'])),
                      ('pc', dict(viewport={'width': 1280, 'height': 800})),
                  ]:
                      ctx = await b.new_context(**opts, locale='fr-FR')
                      page = await ctx.new_page()
                      journal = []
                      page.on('console', lambda m: journal.append(f'{m.type}: {m.text}'))
                      page.on('pageerror', lambda e: journal.append(f'ERREUR: {e}'))
                      await page.goto('http://localhost:8080/nacrea/')
                      await page.wait_for_timeout(25000)
                      await page.screenshot(path=f'captures/{nom}.png')
                      open(f'captures/{nom}.txt', 'w').write('\n'.join(journal))
                      await ctx.close()
                  await b.close()
          asyncio.run(main())
          PY
          python3 capture.py
          ls -l captures
      - name: Dépôt des captures
        run: |
          cd captures
          git init -q
          git config user.name "verification"
          git config user.email "verification@users.noreply.github.com"
          git checkout -q -b captures
          git add .
          git commit -qm "Captures ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" captures
