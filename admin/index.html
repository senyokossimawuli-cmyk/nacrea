<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>YDS Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238E3B55'/%3E%3Ctext x='32' y='42' font-size='26' font-family='Georgia' font-weight='700' text-anchor='middle' fill='%23fff'%3EYDS%3C/text%3E%3C/svg%3E">
<style>
:root{
  --page:#FBF6F4;--surface:#fff;--nude:#F6E7E4;--prune:#8E3B55;--prune-f:#6F2C42;--or:#9A7A36;--txt:#2B1D22;--gris:#6E5F63;
  --bord:#EBDAD6;--err:#B3261E;--err-f:#FCEBEB;--ok:#2E7D4F;--ok-f:#E5F3EA;--or-f:#F7EEDB;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#1A1215;--surface:#251A1F;--nude:#34252B;--prune:#C9587E;--prune-f:#9E4262;--or:#D9B66E;--txt:#F3E7E4;--gris:#B8A8AC;
  --bord:#45343B;--err:#F28B82;--err-f:#3D2023;--ok:#6FCF97;--ok-f:#1D3428;--or-f:#3A3020;}}
:root[data-theme="dark"]{
  --page:#1A1215;--surface:#251A1F;--nude:#34252B;--prune:#C9587E;--prune-f:#9E4262;--or:#D9B66E;--txt:#F3E7E4;--gris:#B8A8AC;
  --bord:#45343B;--err:#F28B82;--err-f:#3D2023;--ok:#6FCF97;--ok-f:#1D3428;--or-f:#3A3020;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;font-weight:700}
.serif{font-family:Georgia,"Times New Roman",serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--bord);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.logo{font-family:Georgia,serif;font-size:22px;color:var(--prune);font-weight:700}
.logo i{color:var(--or);font-weight:400}
.sp{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0}
.tab{border:0;background:none;color:var(--gris);padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--prune);color:#fff}
.badge{background:var(--err);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;margin-left:6px}
main{padding:20px 0 60px}
.card{background:var(--surface);border:1px solid var(--bord);border-radius:16px;padding:16px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--bord);border-radius:16px;padding:14px}
.stat b{display:block;font-size:24px;font-family:Georgia,serif;color:var(--prune);overflow-wrap:anywhere}
.stat span{color:var(--gris);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--gris);font-size:14px}
.key{font-family:ui-monospace,Consolas,monospace;letter-spacing:1.5px;font-weight:700;font-size:18px}
.pill{display:inline-block;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:600}
.p-ok{background:var(--ok-f);color:var(--ok)}.p-or{background:var(--or-f);color:var(--or)}.p-err{background:var(--err-f);color:var(--err)}.p-nude{background:var(--nude);color:var(--gris)}
button,.btn{font:inherit;border-radius:12px;border:1px solid var(--bord);background:var(--surface);color:var(--txt);padding:9px 14px;cursor:pointer;font-weight:600}
button.main,.btn.main{background:var(--prune);border-color:var(--prune);color:#fff}
button.sm{padding:6px 10px;font-size:14px}
button.danger{color:var(--err)}
button:disabled{opacity:.55;cursor:default}
input,select,textarea{font:inherit;color:var(--txt);background:var(--page);border:1px solid var(--bord);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--prune);outline-offset:0}
label{display:block;font-size:14px;color:var(--gris);margin:12px 0 4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dev{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bord);font-size:14px}
.search{margin-bottom:12px}
.link{background:none;border:0;color:var(--prune);padding:0;cursor:pointer;text-align:left;font-weight:700;font-size:17px}
h2{font-family:Georgia,serif;font-size:24px;margin-bottom:12px}
.back{margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-top:1px solid var(--bord);text-align:left;vertical-align:top}
th{color:var(--gris);font-weight:600}
.scroll{overflow-x:auto}
/* fenêtre */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--surface);border-radius:20px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.dlg h3{font-family:Georgia,serif;font-size:21px;margin-bottom:4px}
.dlg .bar{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.keybox{background:var(--nude);border-radius:12px;padding:16px 10px;text-align:center;margin:12px 0;user-select:all}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--txt);color:var(--page);padding:10px 16px;border-radius:12px;z-index:30;max-width:90vw;display:none}
.login{max-width:420px;margin:8vh auto 0}
.err{background:var(--err-f);color:var(--err);padding:10px 12px;border-radius:12px;margin-top:12px;display:none}
.center{text-align:center}
.empty{text-align:center;color:var(--gris);padding:30px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
// ====================================================================
// YDS Admin : page d'administration de YDS Beauty (séparée du logiciel).
// La clé ci-dessous est la clé PUBLIQUE : la sécurité est assurée par la
// base de données (seule l'adresse administrateur peut appeler ces fonctions).
// ====================================================================
const URL_SB = 'https://hzbczjfsqqwwpaazfysz.supabase.co';
const CLE_PUBLIQUE = 'sb_publishable_U7Qbem4nKosVVNn3-4r-ig_ZT7D_4BQ';
const GRACE_JOURS = 7;
const sb = supabase.createClient(URL_SB, CLE_PUBLIQUE, { auth: { persistSession: true, autoRefreshToken: true } });

// ---------- utilitaires ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nb = (v) => (Number(v) || 0);
const fcfa = (n) => nb(n).toLocaleString('fr-FR').replace(/ | /g, ' ') + ' FCFA';
const date = (v) => (v ? new Date(v) : null);
const dcourt = (d) => (d ? d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '—');
const jours = (n) => `${n} jour${n > 1 ? 's' : ''}`;
const ilYa = (d) => {
  if (!d) return 'aucune vente';
  const j = Math.floor((Date.now() - d.getTime()) / 864e5);
  return j <= 0 ? "aujourd'hui" : j === 1 ? 'hier' : `il y a ${j} jours`;
};
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => (t.style.display = 'none'), 3800); }
function msgErreur(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/Email not confirmed/i.test(m)) return "Cette adresse n'est pas encore confirmée.";
  if (/rate limit|too many/i.test(m)) return 'Trop de tentatives. Patientez quelques minutes.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Pas de connexion internet.';
  return m;
}
async function rpc(nom, params) {
  const { data, error } = await sb.rpc(nom, params || {});
  if (error) throw error;
  return data;
}
function numeroWhatsApp(t) {
  let d = String(t || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length === 8) d = '228' + d;
  return d.length >= 10 ? d : null;
}
function whatsapp(tel, texte) {
  const n = numeroWhatsApp(tel);
  window.open(`https://wa.me/${n || ''}?text=${encodeURIComponent(texte)}`, '_blank', 'noopener');
}
async function copier(t) {
  try { await navigator.clipboard.writeText(t); toast('Copié.'); } catch { toast('Copie impossible : sélectionnez le texte.'); }
}

// ---------- fenêtres ----------
function fenetre({ titre, html, boutons }) {
  return new Promise((resolve) => {
    const v = document.createElement('div');
    v.className = 'veil';
    v.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><h3>${esc(titre)}</h3>${html || ''}<div class="bar"></div></div>`;
    const bar = $('.bar', v);
    const fermer = (val) => { v.remove(); resolve(val); };
    for (const b of boutons) {
      const el = document.createElement('button');
      el.textContent = b.texte;
      if (b.main) el.className = 'main';
      el.onclick = async () => {
        if (b.action) {
          el.disabled = true;
          try { const r = await b.action(v); if (r === false) { el.disabled = false; return; } fermer(r ?? true); }
          catch (e) { toast(msgErreur(e)); el.disabled = false; }
        } else fermer(b.valeur ?? false);
      };
      bar.append(el);
    }
    v.addEventListener('mousedown', (e) => { if (e.target === v) fermer(false); });
    document.body.append(v);
    const f = $('input,select', v); if (f) f.focus();
  });
}
const champ = (id, label, valeur = '', type = 'text', extra = '') =>
  `<label for="${id}">${esc(label)}</label><input id="${id}" type="${type}" value="${esc(valeur)}" ${extra}>`;
const choix = (id, label, options, valeur) =>
  `<label for="${id}">${esc(label)}</label><select id="${id}">${options.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(valeur) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
const confirmer = (titre, texte, ok = 'Confirmer', danger = false) =>
  fenetre({ titre, html: `<p>${esc(texte)}</p>`, boutons: [{ texte: 'Annuler' }, { texte: ok, main: !danger, action: () => true }] });

// ---------- état ----------
const S = { user: null, tab: 'vue', fiche: null, donnees: null, recherche: '' };
const app = $('#app');

// =====================================================================
// Connexion
// =====================================================================
function ecranConnexion(mode = 'connexion', email = '') {
  const titre = { connexion: 'Connexion', inscription: 'Créer le compte administrateur', mdp: 'Mot de passe oublié' }[mode];
  app.innerHTML = `
  <div class="wrap"><div class="login card">
    <div class="center"><div class="logo" style="font-size:30px">YDS <i>Admin</i></div>
    <p class="muted">Espace réservé à l'équipe YDS Technology</p></div>
    <h3 class="serif" style="font-size:22px;margin-top:8px">${titre}</h3>
    <form id="f" novalidate>
      ${champ('email', 'Adresse e-mail', email, 'email', 'autocomplete="username" inputmode="email"')}
      ${mode === 'mdp' ? '' : champ('mdp', 'Mot de passe' + (mode === 'inscription' ? ' (8 caractères minimum)' : ''), '', 'password', `autocomplete="${mode === 'inscription' ? 'new-password' : 'current-password'}"`)}
      <div class="err" id="err"></div>
      <div class="actions"><button class="main" style="width:100%" id="ok">${mode === 'connexion' ? 'Se connecter' : mode === 'inscription' ? 'Recevoir le code par e-mail' : 'Recevoir le code'}</button></div>
    </form>
    <div class="actions" style="justify-content:space-between">
      ${mode === 'connexion'
        ? `<button class="sm" data-m="mdp" type="button">Mot de passe oublié</button><button class="sm" data-m="inscription" type="button">Première connexion</button>`
        : `<button class="sm" data-m="connexion" type="button">← Retour</button>`}
    </div>
  </div></div>`;
  const err = (m) => { const e = $('#err'); e.textContent = m; e.style.display = m ? 'block' : 'none'; };
  app.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => ecranConnexion(b.dataset.m, $('#email').value.trim())));
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault();
    const email = $('#email').value.trim().toLowerCase();
    const mdp = mode === 'mdp' ? '' : $('#mdp').value;
    if (!/^\S+@\S+\.\S+$/.test(email)) return err('Adresse e-mail incorrecte.');
    if (mode !== 'mdp' && !mdp) return err('Tapez le mot de passe.');
    if (mode === 'inscription' && mdp.length < 8) return err('Le mot de passe doit avoir au moins 8 caractères.');
    const ok = $('#ok'); ok.disabled = true; err('');
    try {
      if (mode === 'connexion') {
        const { error } = await sb.auth.signInWithPassword({ email, password: mdp });
        if (error) throw error;
      } else if (mode === 'inscription') {
        const { data, error } = await sb.auth.signUp({ email, password: mdp });
        if (error) throw error;
        if (data.user && data.user.identities && data.user.identities.length === 0) {
          throw new Error('Ce compte existe déjà : utilisez « Se connecter » ou « Mot de passe oublié ».');
        }
        if (!data.session) return ecranCode('signup', email, mdp);
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email);
        if (error) throw error;
        return ecranCode('recovery', email, '');
      }
    } catch (e) { err(msgErreur(e)); ok.disabled = false; }
  };
}

function ecranCode(type, email, mdp) {
  app.innerHTML = `
  <div class="wrap"><div class="login card">
    <h3 class="serif" style="font-size:22px">Code reçu par e-mail</h3>
    <p class="muted">Un code a été envoyé à <b>${esc(email)}</b>. Vérifiez aussi les courriers indésirables.</p>
    <form id="f" novalidate>
      ${champ('code', 'Code', '', 'text', 'inputmode="numeric" autocomplete="one-time-code" maxlength="10"')}
      ${type === 'recovery' ? champ('nv', 'Nouveau mot de passe (8 caractères minimum)', '', 'password', 'autocomplete="new-password"') : ''}
      <div class="err" id="err"></div>
      <div class="actions"><button class="main" style="width:100%" id="ok">Valider</button></div>
    </form>
    <div class="actions" style="justify-content:space-between">
      <button class="sm" id="renv" type="button">Renvoyer le code</button>
      <button class="sm" id="ret" type="button">← Retour</button>
    </div>
  </div></div>`;
  const err = (m) => { const e = $('#err'); e.textContent = m; e.style.display = m ? 'block' : 'none'; };
  $('#ret').onclick = () => ecranConnexion('connexion', email);
  $('#renv').onclick = async () => {
    try {
      const { error } = type === 'signup' ? await sb.auth.resend({ type: 'signup', email }) : await sb.auth.resetPasswordForEmail(email);
      if (error) throw error; toast('Code renvoyé.');
    } catch (e) { err(msgErreur(e)); }
  };
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault();
    const code = $('#code').value.replace(/\s/g, '');
    if (!code) return err('Tapez le code reçu.');
    const nv = type === 'recovery' ? $('#nv').value : '';
    if (type === 'recovery' && nv.length < 8) return err('Le mot de passe doit avoir au moins 8 caractères.');
    const ok = $('#ok'); ok.disabled = true; err('');
    try {
      const { error } = await sb.auth.verifyOtp({ email, token: code, type });
      if (error) throw error;
      if (type === 'recovery') { const r = await sb.auth.updateUser({ password: nv }); if (r.error) throw r.error; }
    } catch (e) { err(msgErreur(e)); ok.disabled = false; }
  };
}

// =====================================================================
// Application
// =====================================================================
async function demarrer(user) {
  S.user = user;
  app.innerHTML = '<div class="empty">Chargement…</div>';
  let admin = false;
  try { admin = (await rpc('is_platform_admin')) === true; } catch (e) { return erreurPlein(e); }
  if (!admin) {
    app.innerHTML = `<div class="wrap"><div class="login card center">
      <h3 class="serif" style="font-size:22px">Accès refusé</h3>
      <p>Le compte <b>${esc(user.email)}</b> n'a pas les droits d'administrateur.</p>
      <p class="muted">Connectez-vous avec l'adresse de l'entreprise.</p>
      <div class="actions" style="justify-content:center"><button class="main" id="out">Se déconnecter</button></div></div></div>`;
    $('#out').onclick = () => sb.auth.signOut();
    return;
  }
  S.tab = 'vue'; S.fiche = null;
  squelette();
  charger();
}
function erreurPlein(e) {
  app.innerHTML = `<div class="wrap"><div class="login card center"><p>${esc(msgErreur(e))}</p>
    <div class="actions" style="justify-content:center"><button class="main" id="r">Réessayer</button><button id="out">Déconnexion</button></div></div></div>`;
  $('#r').onclick = () => demarrer(S.user); $('#out').onclick = () => sb.auth.signOut();
}

function squelette() {
  app.innerHTML = `
  <header class="top"><div class="wrap">
    <div class="logo">YDS <i>Admin</i></div><div class="sp"></div>
    <span class="muted" style="display:none" id="qui"></span>
    <button class="sm" id="th" title="Clair / sombre" aria-label="Clair / sombre">◐</button>
    <button class="sm" id="out">Déconnexion</button>
  </div>
  <div class="wrap"><div class="tabs" role="tablist" id="tabs"></div></div></header>
  <main class="wrap" id="main"></main>`;
  $('#out').onclick = () => sb.auth.signOut();
  $('#th').onclick = () => {
    const r = document.documentElement;
    const sombre = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = sombre ? 'light' : 'dark';
    try { localStorage.setItem('yds-theme', r.dataset.theme); } catch {}
  };
  const q = $('#qui'); q.textContent = S.user.email; if (innerWidth > 700) q.style.display = '';
}

async function charger() {
  $('#main').innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const [ap, cl, li] = await Promise.all([rpc('admin_overview'), rpc('admin_accounts'), rpc('admin_licenses', { p_account_id: null })]);
    S.donnees = { ap, clientes: (cl || []).map(cliente), licences: (li || []).map(licence) };
    afficher();
  } catch (e) {
    $('#main').innerHTML = `<div class="card center"><p>${esc(msgErreur(e))}</p><button class="main" id="r">Réessayer</button></div>`;
    $('#r').onclick = charger;
  }
}

// ---------- modèles ----------
function cliente(j) {
  const c = { ...j, creeLe: date(j.cree_le), prochaineFin: date(j.prochaine_fin), derniereVente: date(j.derniere_vente), statuts: j.statuts || [] };
  c.statut = ['suspended', 'late', 'trial', 'active'].find((s) => c.statuts.includes(s)) || 'trial';
  c.aRelancer = c.statuts.includes('late') || c.statuts.includes('suspended') ||
    (c.prochaineFin && (c.prochaineFin.getTime() - Date.now()) / 864e5 <= 3);
  return c;
}
function licence(j) {
  const l = { ...j, expireLe: date(j.expire_le), appareils: j.appareils || [], grace: j.grace_jours == null ? GRACE_JOURS : nb(j.grace_jours) };
  l.libre = !j.compte_id;
  l.enAttente = !l.expireLe && (nb(j.attente_mois) > 0 || nb(j.attente_jours) > 0);
  l.illimitee = !l.enAttente && (!l.expireLe || l.expireLe.getFullYear() >= 2900);
  l.expiree = !l.illimitee && l.expireLe && Date.now() > l.expireLe.getTime();
  l.bloquee = l.expiree && Date.now() > l.expireLe.getTime() + l.grace * 864e5;
  l.nbPc = l.appareils.filter((a) => a.type === 'pc').length;
  l.nbTel = l.appareils.filter((a) => a.type !== 'pc').length;
  return l;
}
function duree(l) {
  if (l.enAttente) return 'Durée : ' + [nb(l.attente_mois) > 0 ? `${l.attente_mois} mois` : '', nb(l.attente_jours) > 0 ? jours(nb(l.attente_jours)) : ''].filter(Boolean).join(' et ') + ", à partir de l'activation";
  if (l.illimitee) return 'Sans date de fin';
  if (l.bloquee) return `Expirée le ${dcourt(l.expireLe)} (bloquée)`;
  if (l.expiree) return `Expirée le ${dcourt(l.expireLe)} · bloquée le ${dcourt(new Date(l.expireLe.getTime() + l.grace * 864e5))}`;
  return `Jusqu'au ${dcourt(l.expireLe)}`;
}
const LIB_STATUT = { trial: 'Essai', active: 'Payé', late: 'En retard', suspended: 'Suspendue' };
const pillStatut = (s) => `<span class="pill ${s === 'active' ? 'p-ok' : s === 'trial' ? 'p-or' : 'p-err'}">${esc(LIB_STATUT[s] || s)}</span>`;
function pillLicence(l) {
  if (!l.active) return '<span class="pill p-err">Suspendue</span>';
  if (l.bloquee) return '<span class="pill p-err">Bloquée</span>';
  if (l.expiree) return '<span class="pill p-err">Expirée</span>';
  if (l.libre) return '<span class="pill p-or">Libre</span>';
  return '<span class="pill p-ok">Active</span>';
}
const MOYENS = [['mobile_money', 'Mobile Money'], ['cash', 'Espèces'], ['bank', 'Virement'], ['other', 'Autre']];
const LIB_MOYEN = Object.fromEntries(MOYENS);
const appareilsTxt = (pc, tel) => [pc > 0 ? `${pc} ordinateur${pc > 1 ? 's' : ''}` : '', tel > 0 ? `${tel} téléphone${tel > 1 ? 's' : ''}` : ''].filter(Boolean).join(' et ');

// ---------- affichage ----------
function afficher() {
  const d = S.donnees;
  const aRel = d.clientes.filter((c) => c.aRelancer);
  const tabs = [['vue', "Vue d'ensemble"], ['clientes', 'Clientes'], ['relance', 'À relancer'], ['licences', 'Licences']];
  $('#tabs').innerHTML = tabs.map(([k, t]) =>
    `<button class="tab" role="tab" data-t="${k}" aria-selected="${S.tab === k && !S.fiche}">${t}${k === 'relance' && aRel.length ? `<span class="badge">${aRel.length}</span>` : ''}</button>`).join('');
  $('#tabs').querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { S.tab = b.dataset.t; S.fiche = null; S.recherche = ''; afficher(); }));
  const m = $('#main');
  if (S.fiche) return pageFiche(m);
  if (S.tab === 'vue') pageVue(m, d, aRel);
  else if (S.tab === 'clientes') pageClientes(m, d.clientes, false);
  else if (S.tab === 'relance') pageClientes(m, aRel, true);
  else pageLicences(m, d.licences);
}

function pageVue(m, d, aRel) {
  const a = d.ap;
  const st = (v, t) => `<div class="stat"><b>${esc(v)}</b><span>${esc(t)}</span></div>`;
  m.innerHTML = `
  <h2>Vue d'ensemble</h2>
  <div class="grid">
    ${st(fcfa(a.encaisse_mois), 'Encaissé ce mois-ci')}
    ${st(fcfa(a.revenu_mensuel), 'Revenu mensuel attendu')}
    ${st(nb(a.comptes), 'Entreprises clientes')}
    ${st(nb(a.boutiques), 'Boutiques')}
  </div>
  <div class="grid">
    ${st(nb(a.essai), 'En essai')}${st(nb(a.actives), 'Payées')}${st(nb(a.en_retard), 'En retard')}${st(nb(a.suspendues), 'Suspendues')}
  </div>
  <div class="card"><b>À relancer</b>
    ${aRel.length ? `<p class="muted">${aRel.length} cliente${aRel.length > 1 ? 's' : ''} à contacter.</p><button class="main sm" data-t2="relance">Voir la liste</button>` : '<p class="muted">Personne à relancer pour le moment.</p>'}
  </div>
  <div class="card"><b>Licences</b>
    <p class="muted">${d.licences.length} licence${d.licences.length > 1 ? 's' : ''} · ${d.licences.filter((l) => l.libre).length} libre${d.licences.filter((l) => l.libre).length > 1 ? 's' : ''} (pas encore activée${d.licences.filter((l) => l.libre).length > 1 ? 's' : ''})</p>
    <button class="main sm" id="nl">Créer une licence</button></div>`;
  const r = $('[data-t2]', m); if (r) r.onclick = () => { S.tab = 'relance'; afficher(); };
  $('#nl', m).onclick = () => nouvelleLicence(null);
}

// ---------- clientes ----------
function texteRelance(c, b) {
  const bonjour = 'Bonjour' + (c.patronne ? ' ' + c.patronne : '');
  const fin = b.fin ? dcourt(date(b.fin)) : '';
  const prix = fcfa(b.prix);
  const nom = `« ${b.nom} »`;
  switch (b.statut) {
    case 'trial': return `${bonjour}, votre essai gratuit de YDS Beauty pour ${nom} se termine le ${fin}. Pour continuer à vendre avec YDS Beauty : ${prix} par mois, payable par Mobile Money. Merci pour votre confiance !`;
    case 'late': return `${bonjour}, l'abonnement YDS Beauty de ${nom} est arrivé à échéance le ${fin}. Merci de régler ${prix} pour éviter la mise en pause de la caisse${b.fin ? ' le ' + dcourt(new Date(date(b.fin).getTime() + GRACE_JOURS * 864e5)) : ''}.`;
    case 'suspended': return `${bonjour}, la caisse YDS Beauty de ${nom} est en pause car l'abonnement n'est pas réglé. Vos données sont en sécurité. Dès réception de ${prix}, nous la réactivons immédiatement.`;
    default: return `${bonjour}, votre abonnement YDS Beauty pour ${nom} se termine le ${fin}. Pensez à le renouveler (${prix} par mois) pour continuer sans interruption. Merci !`;
  }
}

function pageClientes(m, liste, relance) {
  const q = S.recherche.toLowerCase();
  const f = liste.filter((c) => !q || [c.nom, c.patronne, c.email, c.telephone].some((v) => (v || '').toLowerCase().includes(q)));
  m.innerHTML = `<h2>${relance ? 'À relancer' : 'Clientes'}</h2>
    <input class="search" id="q" placeholder="Chercher (nom, patronne, e-mail, téléphone)" value="${esc(S.recherche)}">
    <div id="liste">${f.length ? f.map((c) => `
      <div class="card"><div class="row"><div style="flex:1;min-width:180px">
        <button class="link" data-c="${esc(c.id)}">${esc(c.nom || 'Sans nom')}</button>
        <div class="muted">${esc(c.patronne || '')}${c.telephone ? ' · ' + esc(c.telephone) : ''}</div>
        <div class="muted">${c.nb_boutiques} boutique${c.nb_boutiques > 1 ? 's' : ''} · fin : ${dcourt(c.prochaineFin)} · ${ilYa(c.derniereVente)}</div></div>
        ${pillStatut(c.statut)}</div></div>`).join('') : `<div class="empty">${relance ? 'Personne à relancer.' : 'Aucune cliente pour le moment.'}</div>`}</div>`;
  const q2 = $('#q', m);
  q2.oninput = () => { S.recherche = q2.value; const p = q2.selectionStart; pageClientes(m, liste, relance); const n = $('#q', m); n.focus(); n.setSelectionRange(p, p); };
  m.querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => ouvrirFiche(b.dataset.c)));
}

async function ouvrirFiche(id) {
  try {
    const [f, li] = await Promise.all([rpc('admin_account_detail', { p_account_id: id }), rpc('admin_licenses', { p_account_id: id })]);
    S.fiche = { ...f, licences: (li || []).map(licence) };
    afficher();
  } catch (e) { toast(msgErreur(e)); }
}
async function rafraichirFiche() {
  const id = S.fiche.id;
  await charger0();
  await ouvrirFiche(id);
}
async function charger0() {
  const [ap, cl, li] = await Promise.all([rpc('admin_overview'), rpc('admin_accounts'), rpc('admin_licenses', { p_account_id: null })]);
  S.donnees = { ap, clientes: (cl || []).map(cliente), licences: (li || []).map(licence) };
}

function pageFiche(m) {
  const f = S.fiche;
  const tel = f.telephone || (f.boutiques.find((b) => b.telephone) || {}).telephone;
  m.innerHTML = `
  <button class="sm back" id="ret">← Retour</button>
  <h2>${esc(f.nom)}</h2>
  <div class="card">
    <div>${esc(f.patronne || '')}</div>
    <div class="muted">${esc(f.email || '')}${tel ? ' · ' + esc(tel) : ''}</div>
    <div class="muted">Inscrite le ${dcourt(date(f.cree_le))} · ${nb(f.nb_employees)} employée${nb(f.nb_employees) > 1 ? 's' : ''}</div>
  </div>
  <h3 style="margin:16px 0 8px">Licence</h3>
  ${f.licences.length ? f.licences.map(carteLicence).join('') : `<div class="card"><p class="muted">Cette cliente n'a pas encore de licence.</p><button class="main sm" id="nl">Créer sa licence</button></div>`}
  <h3 style="margin:16px 0 8px">Boutiques</h3>
  ${f.boutiques.map((b) => `
    <div class="card"><div class="row"><b style="flex:1">${esc(b.nom)}</b>${pillStatut(b.statut)}</div>
      <div class="muted">${esc(b.adresse || '')}</div>
      <div class="muted">Fin : ${dcourt(date(b.fin))} · ${fcfa(b.prix)} / mois · ${nb(b.ventes_30j)} vente${nb(b.ventes_30j) > 1 ? 's' : ''} sur 30 jours · ${ilYa(date(b.derniere_vente))}</div>
      <div class="actions">
        <button class="sm" data-rel="${esc(b.id)}">Relancer (WhatsApp)</button>
        <button class="sm" data-prix="${esc(b.id)}" data-p="${nb(b.prix)}">Changer le prix</button>
        ${f.boutiques.length > 1 ? `<button class="sm danger" data-supb="${esc(b.id)}" data-n="${esc(b.nom)}">Supprimer</button>` : ''}
      </div></div>`).join('')}
  <h3 style="margin:16px 0 8px">Paiements reçus</h3>
  <div class="card scroll">${(f.paiements || []).length ? `<table><tr><th>Date</th><th>Montant</th><th>Mois</th><th>Moyen</th><th>Jusqu'au</th><th></th></tr>
    ${f.paiements.map((p) => `<tr><td>${dcourt(date(p.le))}</td><td>${fcfa(p.montant)}</td><td>${nb(p.mois)}</td><td>${esc(LIB_MOYEN[p.moyen] || p.moyen)}${p.note ? `<div class="muted">${esc(p.note)}</div>` : ''}</td><td>${dcourt(date(p.jusqu_au))}</td>
    <td><button class="sm danger" data-delp="${esc(p.id)}">Annuler</button></td></tr>`).join('')}</table>` : '<p class="muted">Aucun paiement enregistré.</p>'}</div>`;
  $('#ret', m).onclick = () => { S.fiche = null; afficher(); };
  const nl = $('#nl', m); if (nl) nl.onclick = () => nouvelleLicence({ id: f.id, nom: f.nom, patronne: f.patronne, telephone: tel });
  brancherLicences(m);
  m.querySelectorAll('[data-rel]').forEach((b) => (b.onclick = () => {
    const bt = f.boutiques.find((x) => x.id === b.dataset.rel);
    whatsapp(bt.telephone || tel, texteRelance(f, bt));
  }));
  m.querySelectorAll('[data-prix]').forEach((b) => (b.onclick = async () => {
    const ok = await fenetre({ titre: 'Prix mensuel', html: champ('px', 'Prix par mois (FCFA)', b.dataset.p, 'number', 'min="0" inputmode="numeric"'),
      boutons: [{ texte: 'Annuler' }, { texte: 'Enregistrer', main: true, action: async (v) => {
        const p = parseInt($('#px', v).value, 10);
        if (!(p >= 0)) { toast('Prix invalide.'); return false; }
        await rpc('admin_set_price', { p_shop_id: b.dataset.prix, p_price: p });
      } }] });
    if (ok) { toast('Prix modifié.'); rafraichirFiche(); }
  }));
  m.querySelectorAll('[data-supb]').forEach((b) => (b.onclick = async () => {
    if (!(await confirmer('Supprimer la boutique', `Supprimer « ${b.dataset.n} » avec ses ventes et son stock ? Cette action est définitive.`, 'Supprimer', true))) return;
    try { await rpc('admin_delete_shop', { p_shop_id: b.dataset.supb }); toast('Boutique supprimée.'); rafraichirFiche(); } catch (e) { toast(msgErreur(e)); }
  }));
  m.querySelectorAll('[data-delp]').forEach((b) => (b.onclick = async () => {
    if (!(await confirmer('Annuler le paiement', 'Le paiement sera effacé de la liste. La date de fin ne change pas : corrigez-la avec « Date de fin » de la licence.', 'Annuler le paiement', true))) return;
    try { await rpc('admin_delete_payment', { p_payment_id: b.dataset.delp }); toast('Paiement annulé.'); rafraichirFiche(); } catch (e) { toast(msgErreur(e)); }

// ---------- licences ----------
function carteLicence(l) {
  const apps = l.appareils;
  return `<div class="card" data-lic="${esc(l.id)}">
    <div class="row"><span class="key" style="flex:1;overflow-wrap:anywhere">${esc(l.cle)}</span>${pillLicence(l)}</div>
    <div>${l.libre ? '<span class="muted">Pas encore activée par une cliente</span>' : `<b>${esc(l.compte || '')}</b>${l.patronne ? ' · ' + esc(l.patronne) : ''}`}</div>
    ${l.note ? `<div class="muted">${esc(l.note)}</div>` : ''}
    <div class="muted">${esc(duree(l))} · ${esc(appareilsTxt(l.max_pc, l.max_mobile))}</div>
    ${apps.length ? apps.map((a) => `<div class="dev"><span>${a.type === 'pc' ? '💻' : '📱'}</span><span style="flex:1">${esc(a.nom || (a.type === 'pc' ? 'Ordinateur' : 'Téléphone'))}${a.email ? `<span class="muted"> · ${esc(a.email)}</span>` : ''}<div class="muted">vu ${ilYa(date(a.vu_le)).replace('aucune vente', 'jamais')}</div></span><button class="sm danger" data-lib="${esc(a.id)}">Libérer</button></div>`).join('') : ''}
    <div class="actions">
      <button class="sm" data-a="cle">Clé / envoyer</button>
      ${!l.libre ? '<button class="sm main" data-a="paie">Paiement reçu</button>' : ''}
      <button class="sm" data-a="prol">Prolonger</button>
      <button class="sm" data-a="fin">Date de fin</button>
      <button class="sm" data-a="mod">Modifier</button>
      <button class="sm ${l.active ? 'danger' : ''}" data-a="act">${l.active ? 'Suspendre' : 'Réactiver'}</button>
      <button class="sm danger" data-a="sup">Supprimer</button>
    </div></div>`;
}

function pageLicences(m, liste) {
  const q = S.recherche.toLowerCase();
  const f = liste.filter((l) => !q || [l.cle, l.note, l.compte, l.patronne].some((v) => (v || '').toLowerCase().includes(q)));
  m.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Licences</h2><button class="main" id="nl">+ Nouvelle licence</button></div>
    <input class="search" id="q" placeholder="Chercher (clé, nom, note)" value="${esc(S.recherche)}">
    ${f.length ? f.map(carteLicence).join('') : '<div class="empty">Aucune licence. Créez la première avec « Nouvelle licence ».</div>'}`;
  const q2 = $('#q', m);
  q2.oninput = () => { S.recherche = q2.value; const p = q2.selectionStart; pageLicences(m, liste); const n = $('#q', m); n.focus(); n.setSelectionRange(p, p); };
  $('#nl', m).onclick = () => nouvelleLicence(null);
  brancherLicences(m);
}

function trouverLicence(id) {
  return (S.fiche && S.fiche.licences.find((l) => l.id === id)) || S.donnees.licences.find((l) => l.id === id);
}
async function apresChangement() {
  if (S.fiche) await rafraichirFiche(); else { await charger0(); afficher(); }
}
function brancherLicences(m) {
  m.querySelectorAll('[data-lic]').forEach((carte) => {
    const l = trouverLicence(carte.dataset.lic);
    if (!l) return;
    carte.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => actionLicence(b.dataset.a, l)));
    carte.querySelectorAll('[data-lib]').forEach((b) => (b.onclick = async () => {
      if (!(await confirmer('Libérer cet appareil', 'La place sera disponible pour un autre appareil. La cliente devra se reconnecter sur celui-ci.', 'Libérer'))) return;
      try { await rpc('admin_remove_license_device', { p_device: b.dataset.lib }); toast('Appareil libéré.'); apresChangement(); } catch (e) { toast(msgErreur(e)); }
    }));
  });
}

async function actionLicence(a, l) {
  try {
    if (a === 'cle') return montrerCle(l.cle, { tel: l.telephone, patronne: l.patronne, pc: l.max_pc, mob: l.max_mobile, liee: !l.libre });
    if (a === 'paie') return paiement(l);
    if (a === 'prol') return prolonger(l);
    if (a === 'fin') return dateFin(l);
    if (a === 'mod') return modifier(l);
    if (a === 'act') {
      if (l.active && !(await confirmer('Suspendre la licence', 'La cliente ne pourra plus utiliser YDS Beauty tant que vous ne la réactivez pas.', 'Suspendre', true))) return;
      await rpc('admin_set_license_active', { p_id: l.id, p_active: !l.active });
      toast(l.active ? 'Licence suspendue.' : 'Licence réactivée.');
      return apresChangement();
    }
    if (a === 'sup') {
      if (!(await confirmer('Supprimer la licence', `Supprimer la clé ${l.cle} ? Les appareils liés seront déconnectés. Définitif.`, 'Supprimer', true))) return;
      await rpc('admin_delete_license', { p_id: l.id });
      toast('Licence supprimée.');
      return apresChangement();
    }
  } catch (e) { toast(msgErreur(e)); }
}

function texteLicence(cle, { patronne, pc, mob, liee }) {
  return `Bonjour${patronne ? ' ' + patronne : ''}, voici votre clé de licence YDS Beauty : ${cle}\n` +
    (liee ? "Elle est déjà activée sur votre entreprise, vous n'avez rien à taper." : 'Ouvrez YDS Beauty, connectez-vous, puis tapez cette clé quand elle vous est demandée.') +
    ` Elle fonctionne sur ${appareilsTxt(pc, mob)}. Gardez ce message.`;
}
function montrerCle(cle, o, titre = 'Clé de licence') {
  const texte = texteLicence(cle, o);
  return fenetre({
    titre,
    html: `<div class="keybox key" style="font-size:22px">${esc(cle)}</div>
      <p class="muted">${o.liee ? 'Déjà liée à cette cliente : elle n\'a rien à taper.' : 'À envoyer à la cliente. Elle la tapera une seule fois.'} Valable sur ${esc(appareilsTxt(o.pc, o.mob))}.</p>`,
    boutons: [{ texte: 'Fermer' },
      { texte: 'Copier la clé', action: () => { copier(cle); return false; } },
      { texte: 'WhatsApp', main: true, action: () => { whatsapp(o.tel, texte); return false; } }],
  });
}

const DUREES = [['essai', 'Essai 14 jours'], ['1', '1 mois'], ['3', '3 mois'], ['6', '6 mois'], ['12', '1 an'], ['illim', 'Illimitée'], ['date', 'Date précise']];
async function nouvelleLicence(compte) {
  const ok = await fenetre({
    titre: compte ? `Licence de ${compte.nom}` : 'Nouvelle licence',
    html: champ('note', compte ? 'Note (facultatif)' : 'Pour qui ? (note facultative)', compte ? compte.nom : '') +
      choix('dur', 'Durée', DUREES, '1') +
      `<div id="dd" style="display:none">${champ('dat', 'Date de fin', '', 'date')}</div>` +
      `<div class="row" style="flex-wrap:nowrap"><div style="flex:1">${champ('pc', 'Ordinateurs', '1', 'number', 'min="0" max="10" inputmode="numeric"')}</div><div style="flex:1">${champ('mob', 'Téléphones', '1', 'number', 'min="0" max="10" inputmode="numeric"')}</div></div>` +
      `<p class="muted">La durée démarre quand la cliente active la clé.${compte ? '' : ''}</p>`,
    boutons: [{ texte: 'Annuler' }, { texte: 'Créer', main: true, action: async (v) => {
      const dur = $('#dur', v).value;
      const pc = parseInt($('#pc', v).value, 10), mob = parseInt($('#mob', v).value, 10);
      if (!(pc >= 0 && mob >= 0) || pc + mob < 1) { toast('Prévoyez au moins un appareil.'); return false; }
      const p = { p_note: $('#note', v).value.trim() || null, p_max_pc: pc, p_max_mobile: mob, p_account_id: compte ? compte.id : null, p_months: null, p_days: null, p_expires_at: null };
      if (dur === 'essai') p.p_days = 14;
      else if (dur === 'date') {
        const d = $('#dat', v).value;
        if (!d) { toast('Choisissez la date de fin.'); return false; }
        p.p_expires_at = new Date(d + 'T23:59:00').toISOString();
      } else if (dur !== 'illim') p.p_months = parseInt(dur, 10);
      const r = await rpc('admin_create_license', p);
      return { cle: r.cle, pc, mob };
    } }],
  });
  if (!ok || !ok.cle) return;
  await apresChangement();
  await montrerCle(ok.cle, { tel: compte && compte.telephone, patronne: compte && compte.patronne, pc: ok.pc, mob: ok.mob, liee: !!compte }, 'Licence créée');
}
document.addEventListener('change', (e) => { if (e.target.id === 'dur') $('#dd').style.display = e.target.value === 'date' ? '' : 'none'; });

async function paiement(l) {
  const ok = await fenetre({
    titre: `Paiement de ${l.compte || l.cle}`,
    html: champ('mt', 'Montant reçu (FCFA)', nb(l.mensuel) > 0 ? l.mensuel : '', 'number', 'min="1" inputmode="numeric"') +
      choix('mo', 'Mois payés', [1, 2, 3, 6, 12].map((n) => [n, `${n} mois`]), 1) +
      choix('my', 'Moyen de paiement', MOYENS, 'mobile_money') + champ('nt', 'Note (facultatif)'),
    boutons: [{ texte: 'Annuler' }, { texte: 'Enregistrer', main: true, action: async (v) => {
      const mt = parseInt($('#mt', v).value, 10);
      if (!(mt > 0)) { toast('Indiquez le montant reçu.'); return false; }
      return { fin: await rpc('admin_record_license_payment', { p_id: l.id, p_amount: mt, p_months: parseInt($('#mo', v).value, 10), p_method: $('#my', v).value, p_note: $('#nt', v).value.trim() || null }) };
    } }],
  });
  if (!ok) return;
  toast(ok.fin ? `Paiement enregistré. Licence jusqu'au ${dcourt(date(ok.fin))}.` : 'Paiement enregistré.');
  apresChangement();
}
async function prolonger(l) {
  const ok = await fenetre({
    titre: 'Prolonger la licence',
    html: `<div class="row" style="flex-wrap:nowrap"><div style="flex:1">${champ('pm', 'Mois en plus', '1', 'number', 'min="0" max="60" inputmode="numeric"')}</div><div style="flex:1">${champ('pj', 'Jours en plus', '0', 'number', 'min="0" max="1000" inputmode="numeric"')}</div></div>`,
    boutons: [{ texte: 'Annuler' }, { texte: 'Prolonger', main: true, action: async (v) => {
      const mo = parseInt($('#pm', v).value, 10) || 0, jo = parseInt($('#pj', v).value, 10) || 0;
      if (mo + jo < 1) { toast('Indiquez une durée.'); return false; }
      await rpc('admin_extend_license', { p_id: l.id, p_months: mo, p_days: jo });
    } }],
  });
  if (ok) { toast('Licence prolongée.'); apresChangement(); }
}
async function dateFin(l) {
  const init = l.expireLe && !l.illimitee ? l.expireLe.toISOString().slice(0, 10) : '';
  const ok = await fenetre({
    titre: 'Date de fin',
    html: champ('df', 'Date de fin', init, 'date') + '<p class="muted">Laissez vide puis choisissez « Sans date de fin » pour une licence illimitée.</p>',
    boutons: [{ texte: 'Annuler' },
      { texte: 'Sans date de fin', action: async () => { await rpc('admin_set_license_expiry', { p_id: l.id, p_expires_at: null }); } },
      { texte: 'Enregistrer', main: true, action: async (v) => {
        const d = $('#df', v).value;
        if (!d) { toast('Choisissez une date.'); return false; }
        await rpc('admin_set_license_expiry', { p_id: l.id, p_expires_at: new Date(d + 'T23:59:00').toISOString() });
      } }],
  });
  if (ok) { toast('Date de fin modifiée.'); apresChangement(); }
}
async function modifier(l) {
  const ok = await fenetre({
    titre: 'Modifier la licence',
    html: champ('mn', 'Note', l.note || '') +
      `<div class="row" style="flex-wrap:nowrap"><div style="flex:1">${champ('mp', 'Ordinateurs', l.max_pc, 'number', 'min="0" max="10" inputmode="numeric"')}</div><div style="flex:1">${champ('mm', 'Téléphones', l.max_mobile, 'number', 'min="0" max="10" inputmode="numeric"')}</div></div>`,
    boutons: [{ texte: 'Annuler' }, { texte: 'Enregistrer', main: true, action: async (v) => {
      const pc = parseInt($('#mp', v).value, 10), mob = parseInt($('#mm', v).value, 10);
      if (!(pc >= 0 && mob >= 0) || pc + mob < 1) { toast('Prévoyez au moins un appareil.'); return false; }
      await rpc('admin_update_license', { p_id: l.id, p_note: $('#mn', v).value.trim() || null, p_max_pc: pc, p_max_mobile: mob });
    } }],
  });
  if (ok) { toast('Licence modifiée.'); apresChangement(); }
}

// ---------- démarrage ----------
try { const t = localStorage.getItem('yds-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
let dernierId = null;
sb.auth.onAuthStateChange((evt, session) => {
  if (evt === 'SIGNED_OUT' || !session) { dernierId = null; S.fiche = null; ecranConnexion(); return; }
  if (evt === 'TOKEN_REFRESHED' && dernierId === session.user.id) return;
  if (dernierId === session.user.id && evt !== 'SIGNED_IN') return;
  dernierId = session.user.id;
  setTimeout(() => demarrer(session.user), 0);
});
sb.auth.getSession().then(({ data }) => { if (!data.session) ecranConnexion(); });
</script>
